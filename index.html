<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora</title>
<style>
  :root {
    color-scheme: light dark;
    --base: #f4f2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --base: #07070b; }
  }
  html, body {
    margin: 0;
    background: var(--base);
    overflow: hidden;
  }
  canvas {
    position: fixed;
    left: 0;
    width: 100%;
    display: block;
  }
  #main {
    top: 0;
    height: 100%;
  }
  .safe {
    display: none;
  }
  @supports (top: env(safe-area-inset-top)) {
    .safe { display: block; }
    #main { height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); top: env(safe-area-inset-top, 0px); }
  }
  .top {
    height: env(safe-area-inset-top, 0px);
    top: 0;
  }
  .bottom {
    height: env(safe-area-inset-bottom, 0px);
    bottom: 0;
  }
</style>
</head>
<body>
<canvas id="main"></canvas>
<canvas class="safe top"></canvas>
<canvas class="safe bottom"></canvas>
<script>
(() => {
  const main = document.querySelector('#main');
  const surfaces = [...document.querySelectorAll('canvas')].map(canvas => ({ canvas, ctx: canvas.getContext('2d') }));
  const darkQuery = matchMedia('(prefers-color-scheme: dark)');
  const reducedQuery = matchMedia('(prefers-reduced-motion: reduce)');

  const RESOLUTION = 1 / 6;
  const BLOBS = 7;
  const HARMONIES = [[0, 30, -30], [0, 150, 210], [0, 120, 240]];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = list => list[Math.floor(Math.random() * list.length)];
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t * t * (3 - 2 * t);
  const lerpHue = (a, b, t) => a + ((((b - a) % 360) + 540) % 360 - 180) * t;
  const readBase = () => getComputedStyle(document.documentElement).getPropertyValue('--base').trim();

  let dark = darkQuery.matches;
  let base = readBase();
  let generation = 0;
  let palette = samplePalette();

  function samplePalette() {
    const hue = rand(0, 360);
    return pick(HARMONIES).map(offset => hue + offset);
  }

  function sampleState() {
    return {
      x: rand(-0.1, 1.1),
      y: rand(-0.1, 1.1),
      r: rand(0.35, 0.8),
      h: pick(palette) + rand(-12, 12),
      s: rand(dark ? 55 : 60, dark ? 85 : 90),
      l: rand(dark ? 40 : 62, dark ? 60 : 78),
      a: rand(dark ? 0.35 : 0.4, dark ? 0.7 : 0.75)
    };
  }

  const blobs = Array.from({ length: BLOBS }, () => ({
    from: sampleState(),
    to: sampleState(),
    t: Math.random(),
    dur: rand(14, 26),
    generation
  }));

  function resize(entries) {
    for (const { target, contentRect } of entries) {
      target.width = Math.max(1, Math.round(contentRect.width * RESOLUTION));
      target.height = Math.max(1, Math.round(contentRect.height * RESOLUTION));
    }
  }

  function advance(b, dt) {
    b.t += dt / b.dur;
    if (b.t < 1) return;
    b.t = 0;
    b.from = b.to;
    b.to = sampleState();
    b.dur = rand(14, 26);
    b.generation = generation;
    if (blobs.every(other => other.generation === generation)) {
      generation++;
      palette = samplePalette();
    }
  }

  function field() {
    return blobs.map(b => {
      const k = ease(b.t);
      return {
        x: lerp(b.from.x, b.to.x, k),
        y: lerp(b.from.y, b.to.y, k),
        r: lerp(b.from.r, b.to.r, k),
        h: lerpHue(b.from.h, b.to.h, k),
        s: lerp(b.from.s, b.to.s, k),
        l: lerp(b.from.l, b.to.l, k),
        a: lerp(b.from.a, b.to.a, k)
      };
    });
  }

  function paint({ canvas, ctx }, spots, view) {
    if (getComputedStyle(canvas).display === 'none') return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 1 || rect.height < 1) return;
    const sx = canvas.width / Math.max(1, rect.width);
    const sy = canvas.height / Math.max(1, rect.height);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = dark ? 'screen' : 'multiply';
    ctx.setTransform(sx, 0, 0, sy, (view.left - rect.left) * sx, (view.top - rect.top) * sy);
    const diag = Math.hypot(view.width, view.height);
    for (const p of spots) {
      const x = p.x * view.width;
      const y = p.y * view.height;
      const g = ctx.createRadialGradient(x, y, 0, x, y, p.r * diag);
      g.addColorStop(0, `hsla(${p.h}, ${p.s}%, ${p.l}%, ${p.a})`);
      g.addColorStop(1, `hsla(${p.h}, ${p.s}%, ${p.l}%, 0)`);
      ctx.fillStyle = g;
      ctx.fillRect(rect.left - view.left, rect.top - view.top, rect.width, rect.height);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    const step = reducedQuery.matches ? dt * 0.15 : dt;
    for (const b of blobs) advance(b, step);
    const spots = field();
    const view = main.getBoundingClientRect();
    for (const surface of surfaces) paint(surface, spots, view);
    requestAnimationFrame(frame);
  }

  darkQuery.addEventListener('change', e => {
    dark = e.matches;
    base = readBase();
    for (const b of blobs) b.to = { ...sampleState(), h: b.to.h };
  });
  const observer = new ResizeObserver(resize);
  for (const { canvas } of surfaces) observer.observe(canvas);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
