<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora</title>
<style>
  :root {
    color-scheme: light dark;
    --base: #f4f2f7;
    height: 100lvh;
    background-color: var(--base);
    background-repeat: no-repeat;
    background-blend-mode: multiply;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --base: #07070b;
      background-blend-mode: screen;
    }
  }
  body {
    margin: 0;
  }
</style>
</head>
<body>
<script>
(() => {
  const root = document.documentElement;
  const darkQuery = matchMedia('(prefers-color-scheme: dark)');
  const reducedQuery = matchMedia('(prefers-reduced-motion: reduce)');

  const BLOBS = 7;
  const HARMONIES = [[0, 30, -30], [0, 150, 210], [0, 120, 240]];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = list => list[Math.floor(Math.random() * list.length)];
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t * t * (3 - 2 * t);
  const lerpHue = (a, b, t) => a + ((((b - a) % 360) + 540) % 360 - 180) * t;

  let dark = darkQuery.matches;
  let generation = 0;
  let palette = samplePalette();

  function samplePalette() {
    const hue = rand(0, 360);
    return pick(HARMONIES).map(offset => hue + offset);
  }

  function sampleState() {
    return {
      x: rand(-10, 110),
      y: rand(-10, 110),
      r: rand(35, 80),
      h: pick(palette) + rand(-12, 12),
      s: rand(dark ? 55 : 60, dark ? 85 : 90),
      l: rand(dark ? 40 : 62, dark ? 60 : 78),
      a: rand(dark ? 0.35 : 0.4, dark ? 0.7 : 0.75)
    };
  }

  const blobs = Array.from({ length: BLOBS }, () => ({
    from: sampleState(),
    to: sampleState(),
    t: Math.random(),
    dur: rand(14, 26),
    generation
  }));

  function advance(b, dt) {
    b.t += dt / b.dur;
    if (b.t < 1) return;
    b.t = 0;
    b.from = b.to;
    b.to = sampleState();
    b.dur = rand(14, 26);
    b.generation = generation;
    if (blobs.every(other => other.generation === generation)) {
      generation++;
      palette = samplePalette();
    }
  }

  function gradient(b) {
    const k = ease(b.t);
    const x = lerp(b.from.x, b.to.x, k);
    const y = lerp(b.from.y, b.to.y, k);
    const r = lerp(b.from.r, b.to.r, k);
    const h = lerpHue(b.from.h, b.to.h, k);
    const s = lerp(b.from.s, b.to.s, k);
    const l = lerp(b.from.l, b.to.l, k);
    const a = lerp(b.from.a, b.to.a, k);
    return `radial-gradient(circle ${r}lvmax at ${x}% ${y}%, hsla(${h}, ${s}%, ${l}%, ${a}), hsla(${h}, ${s}%, ${l}%, 0))`;
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    const step = reducedQuery.matches ? dt * 0.15 : dt;
    for (const b of blobs) advance(b, step);
    root.style.backgroundImage = blobs.map(gradient).join(', ');
    requestAnimationFrame(frame);
  }

  darkQuery.addEventListener('change', e => {
    dark = e.matches;
    for (const b of blobs) b.to = { ...sampleState(), h: b.to.h };
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
