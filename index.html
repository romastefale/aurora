<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f3f1">
<meta name="description" content="Fundo translúcido em toda a tela, no claro ou no escuro do sistema.">
<title>Aurora</title>
<script>
(function () {
  var dark = false;
  try { dark = matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
  var color = dark ? "#141416" : "#f4f3f1";
  var root = document.documentElement;
  root.style.backgroundColor = color;
  root.style.colorScheme = dark ? "dark" : "light";
  root.setAttribute("data-scheme", dark ? "dark" : "light");
  var tag = document.querySelector('meta[name="theme-color"]:not([media])');
  if (tag) tag.setAttribute("content", color);
})();
</script>
<style>
html, body {
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: #f4f3f1;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  html, body { background: #141416; }
}
#scheme-probe {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
  color: #000;
  pointer-events: none;
}
@media (prefers-color-scheme: dark) {
  #scheme-probe { color: #fff; }
}
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100lvw;
  height: 100lvh;
  display: block;
}
</style>
</head>
<body>
<div id="scheme-probe"></div>
<canvas></canvas>
<script>
(function () {
  var SIDE = 4096;
  var SIGMA = 200;
  var SEED = 314159;
  var MAX = 7;
  var XY0 = -2000;
  var XY1 = 7000;
  var R0 = 200;
  var R1 = 4000;

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function erf(x) {
    var sign = x < 0 ? -1 : 1;
    var a = Math.abs(x);
    var t = 1 / (1 + 0.3275911 * a);
    var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a);
    return sign * y;
  }

  function colorOf(hue, dark) {
    var s = (dark ? 58 : 72) / 100;
    var l = (dark ? 42 : 58) / 100;
    var span = s * Math.min(l, 1 - l);
    var channel = function (n) {
      var k = (n + hue / 30) % 12;
      if (k < 0) k += 12;
      return l - span * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    };
    return [channel(0), channel(8), channel(4)];
  }

  function hex(dark) {
    return dark ? "#141416" : "#f4f3f1";
  }

  function solidOf(dark) {
    return dark ? [0x14 / 255, 0x14 / 255, 0x16 / 255] : [0xf4 / 255, 0xf3 / 255, 0xf1 / 255];
  }

  var random = mulberry32(SEED);
  var count = 6 + Math.floor(random() * 2);
  var blooms = [];
  var i;
  for (i = 0; i < count; i++) {
    blooms.push({
      hue: random() * 360,
      x: random() * SIDE,
      y: random() * SIDE,
      rx: 900 + random() * 1100,
      ry: 700 + random() * 900
    });
  }
  for (i = 0; i < blooms.length; i++) {
    var bloom = blooms[i];
    bloom.px = random() * Math.PI * 2;
    bloom.py = random() * Math.PI * 2;
    bloom.prx = random() * Math.PI * 2;
    bloom.pry = random() * Math.PI * 2;
    bloom.ph = random() * Math.PI * 2;
    bloom.ax = 180 + random() * 320;
    bloom.ay = 160 + random() * 280;
    bloom.ar = 0.05 + random() * 0.07;
    bloom.ah = 22 + random() * 26;
    bloom.tx = 280 + random() * 220;
    bloom.ty = 300 + random() * 240;
    bloom.trx = 320 + random() * 200;
    bloom.try = 340 + random() * 220;
    bloom.th = 360 + random() * 240;
  }

  function wave(time, period, phase) {
    return Math.sin((time / period) * Math.PI * 2 + phase);
  }

  function pose(time, dark) {
    var alpha = dark ? 0.75 : 0.85;
    var out = [];
    for (var n = 0; n < blooms.length; n++) {
      var bloom = blooms[n];
      var hue = bloom.hue + wave(time, bloom.th, bloom.ph) * bloom.ah;
      var color = colorOf(hue, dark);
      out.push({
        x: bloom.x + wave(time, bloom.tx, bloom.px) * bloom.ax,
        y: bloom.y + wave(time, bloom.ty, bloom.py) * bloom.ay,
        rx: bloom.rx * (1 + wave(time, bloom.trx, bloom.prx) * bloom.ar),
        ry: bloom.ry * (1 + wave(time, bloom.try, bloom.pry) * bloom.ar),
        r: color[0],
        g: color[1],
        b: color[2],
        a: alpha
      });
    }
    return out;
  }

  function systemDark() {
    var node = document.getElementById("scheme-probe");
    if (node) {
      var c = String(getComputedStyle(node).color || "").replace(/\s/g, "").toLowerCase();
      if (c.indexOf("255,255,255") !== -1) return true;
      if (c.indexOf("0,0,0") !== -1) return false;
    }
    try { return matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; }
  }

  function paintChrome(dark) {
    var color = hex(dark);
    var root = document.documentElement;
    if (root.getAttribute("data-scheme") !== (dark ? "dark" : "light")) {
      root.setAttribute("data-scheme", dark ? "dark" : "light");
    }
    root.style.backgroundColor = color;
    root.style.colorScheme = dark ? "dark" : "light";
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var n = 0; n < metas.length; n++) {
      if (!metas[n].hasAttribute("media") && metas[n].getAttribute("content") !== color) {
        metas[n].setAttribute("content", color);
      }
    }
  }

  function measure() {
    var box = canvas.getBoundingClientRect();
    return { w: Math.ceil(box.width), h: Math.ceil(box.height) };
  }

  function fieldOf(cssW, cssH) {
    var scale = Math.max(cssW, cssH) / SIDE;
    return {
      scale: scale,
      x: (cssW - SIDE * scale) / 2,
      y: (cssH - SIDE * scale) / 2
    };
  }

  function put16(data, offset, value, min, max) {
    var t = (value - min) / (max - min);
    if (t < 0) t = 0;
    if (t > 1) t = 1;
    var n = Math.round(t * 65535);
    data[offset] = (n >> 8) & 255;
    data[offset + 1] = n & 255;
  }

  var host = document.querySelector("canvas");
  var canvas = host;
  var gl = null;
  var gpu = null;
  var ctx = null;
  var texData = new Uint8Array(MAX * 3 * 4);

  var glCanvas = document.createElement("canvas");
  gl = glCanvas.getContext("webgl", {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    powerPreference: "low-power"
  });

  function compile(type, source) {
    var shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  if (gl) {
    var prec = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
    if (!prec || prec.precision < 23) gl = null;
  }

  if (gl) {
    var vert = compile(gl.VERTEX_SHADER, "attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}");
    var frag = compile(gl.FRAGMENT_SHADER, [
      "#ifdef GL_FRAGMENT_PRECISION_HIGH",
      "precision highp float;",
      "#else",
      "precision mediump float;",
      "#endif",
      "uniform sampler2D uField;",
      "uniform vec2 uCss;",
      "uniform vec2 uBuf;",
      "uniform vec2 uOrigin;",
      "uniform float uScale;",
      "uniform vec3 uSolid;",
      "float erf1(float x){float s=x<0.0?-1.0:1.0;float a=abs(x);float t=1.0/(1.0+0.3275911*a);float p=((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t;return s*(1.0-p*exp(-a*a));}",
      "vec3 toLin(vec3 c){c=clamp(c,0.0,1.0);return mix(c/12.92,pow((c+0.055)/1.055,vec3(2.4)),step(vec3(0.04045),c));}",
      "vec3 toSrgb(vec3 c){c=clamp(c,0.0,1.0);return mix(c*12.92,1.055*pow(c,vec3(1.0/2.4))-0.055,step(vec3(0.0031308),c));}",
      "float u16(float hi,float lo,float a,float b){float n=hi*255.0*256.0+lo*255.0;return a+(n/65535.0)*(b-a);}",
      "vec4 tap(float p){return texture2D(uField,vec2((p+0.5)/21.0,0.5));}",
      "void main(){",
      "vec2 css=vec2(gl_FragCoord.x/uBuf.x*uCss.x,uCss.y-(gl_FragCoord.y/uBuf.y*uCss.y));",
      "vec2 field=(css-uOrigin)/uScale;",
      "vec3 acc=vec3(0.0);",
      "float cover=0.0;",
      "for(int i=0;i<7;i++){",
      "float base=float(i)*3.0;",
      "vec4 A=tap(base);",
      "vec4 B=tap(base+1.0);",
      "vec4 C=tap(base+2.0);",
      "float alpha=C.a;",
      "vec2 outer=vec2(u16(B.r,B.g,200.0,4000.0),u16(B.b,B.a,200.0,4000.0))+vec2(600.0);",
      "float u=length((field-vec2(u16(A.r,A.g,-2000.0,7000.0),u16(A.b,A.a,-2000.0,7000.0)))/outer);",
      "float radius=(outer.x+outer.y)*0.5-600.0;",
      "float edge=(u*(radius+600.0)-radius)/(200.0*1.41421356);",
      "float fade=clamp(alpha*step(u,1.0)*0.5*(1.0-erf1(edge)),0.0,1.0);",
      "vec3 ink=toLin(C.rgb)*fade;",
      "acc=ink+acc*(1.0-fade);",
      "cover=fade+cover*(1.0-fade);",
      "}",
      "gl_FragColor=vec4(toSrgb(acc+toLin(uSolid)*(1.0-cover)),1.0);",
      "}"
    ].join(""));
    if (vert && frag) {
      var program = gl.createProgram();
      gl.attachShader(program, vert);
      gl.attachShader(program, frag);
      gl.bindAttribLocation(program, 0, "a");
      gl.linkProgram(program);
      if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
        var buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        gl.useProgram(program);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        var tex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 21, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, texData);
        gl.uniform1i(gl.getUniformLocation(program, "uField"), 0);
        gpu = {
          loc: {
            css: gl.getUniformLocation(program, "uCss"),
            buf: gl.getUniformLocation(program, "uBuf"),
            origin: gl.getUniformLocation(program, "uOrigin"),
            scale: gl.getUniformLocation(program, "uScale"),
            solid: gl.getUniformLocation(program, "uSolid")
          }
        };
        host.parentNode.replaceChild(glCanvas, host);
        canvas = glCanvas;
      }
    }
  }
  if (!gpu) {
    gl = null;
    ctx = host.getContext("2d", { alpha: false });
    canvas = host;
  }

  var lastW = 0;
  var lastH = 0;
  var lastDark = systemDark();
  var lastDraw = 0;
  paintChrome(lastDark);
  var reduced = false;
  try { reduced = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var running = false;

  function fit() {
    var size = measure();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var bw = Math.max(1, Math.min(4096, Math.round(size.w * dpr)));
    var bh = Math.max(1, Math.min(4096, Math.round(size.h * dpr)));
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    lastW = size.w;
    lastH = size.h;
    return size;
  }

  function upload(layers) {
    texData.fill(0);
    for (var n = 0; n < layers.length && n < MAX; n++) {
      var layer = layers[n];
      var o = n * 12;
      put16(texData, o, layer.x, XY0, XY1);
      put16(texData, o + 2, layer.y, XY0, XY1);
      put16(texData, o + 4, layer.rx, R0, R1);
      put16(texData, o + 6, layer.ry, R0, R1);
      texData[o + 8] = Math.round(Math.min(1, Math.max(0, layer.r)) * 255);
      texData[o + 9] = Math.round(Math.min(1, Math.max(0, layer.g)) * 255);
      texData[o + 10] = Math.round(Math.min(1, Math.max(0, layer.b)) * 255);
      texData[o + 11] = Math.round(Math.min(1, Math.max(0, layer.a)) * 255);
    }
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 21, 1, gl.RGBA, gl.UNSIGNED_BYTE, texData);
  }

  function draw() {
    var dark = lastDark;
    var size = { w: lastW, h: lastH };
    if (!(size.w > 0)) size = fit();
    var field = fieldOf(size.w, size.h);
    var time = reduced ? 0 : Date.now() / 1000;
    var layers = pose(time, dark);
    var paper = solidOf(dark);
    if (gl && gpu) {
      upload(layers);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(gpu.loc.css, size.w, size.h);
      gl.uniform2f(gpu.loc.buf, canvas.width, canvas.height);
      gl.uniform2f(gpu.loc.origin, field.x, field.y);
      gl.uniform1f(gpu.loc.scale, field.scale);
      gl.uniform3f(gpu.loc.solid, paper[0], paper[1], paper[2]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      return;
    }
    if (!ctx) return;
    ctx.setTransform(canvas.width / size.w, 0, 0, canvas.height / size.h, 0, 0);
    ctx.fillStyle = hex(dark);
    ctx.fillRect(0, 0, size.w, size.h);
    for (var k = 0; k < layers.length; k++) {
      var layer = layers[k];
      var radius = (layer.rx + layer.ry) / 2;
      var outer = radius + SIGMA * 3;
      var rw = (layer.rx + SIGMA * 3) * field.scale;
      var rh = (layer.ry + SIGMA * 3) * field.scale;
      ctx.save();
      ctx.translate(field.x + layer.x * field.scale, field.y + layer.y * field.scale);
      ctx.scale(rw, rh);
      var gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      for (var s = 0; s <= 24; s++) {
        var u = s / 24;
        var fade = s === 24 ? 0 : layer.a * 0.5 * (1 - erf((u * outer - radius) / (SIGMA * Math.SQRT2)));
        if (fade < 0) fade = 0;
        gradient.addColorStop(u, "rgba(" + Math.round(layer.r * 255) + "," + Math.round(layer.g * 255) + "," + Math.round(layer.b * 255) + "," + fade.toFixed(4) + ")");
      }
      ctx.fillStyle = gradient;
      ctx.fillRect(-1, -1, 2, 2);
      ctx.restore();
    }
  }

  function tick(now) {
    running = false;
    if (reduced || document.hidden) return;
    if (now - lastDraw >= 32) {
      lastDraw = now;
      draw();
    }
    running = true;
    requestAnimationFrame(tick);
  }

  function wake() {
    if (running) return;
    running = true;
    requestAnimationFrame(tick);
  }

  function resized() {
    fit();
    lastDraw = 0;
    draw();
    if (!reduced && !document.hidden) wake();
  }

  function schemeChanged() {
    var dark = systemDark();
    if (dark === lastDark) return;
    lastDark = dark;
    paintChrome(dark);
    lastDraw = 0;
    draw();
  }

  function watch(query, fn) {
    if (!window.matchMedia) return;
    var q = matchMedia(query);
    if (!q) return;
    if (q.addEventListener) q.addEventListener("change", fn);
    else if (q.addListener) q.addListener(fn);
  }

  fit();
  draw();
  if (!reduced) wake();
  addEventListener("resize", resized, { passive: true });
  addEventListener("orientationchange", resized, { passive: true });
  addEventListener("pageshow", function () { schemeChanged(); resized(); });
  if (window.visualViewport) visualViewport.addEventListener("resize", resized, { passive: true });
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener("change", resized);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) running = false;
    else wake();
  });
  watch("(prefers-color-scheme: dark)", schemeChanged);
  watch("(prefers-color-scheme: light)", schemeChanged);
  watch("(prefers-reduced-motion: reduce)", function () {
    try { reduced = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { reduced = false; }
    if (reduced) {
      running = false;
      draw();
    } else wake();
  });
})();
</script>
</body>
</html>
