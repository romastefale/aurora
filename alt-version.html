<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aurora Alt</title>
<meta name="apple-mobile-web-app-title" content="Aurora Alt">
<meta name="description" content="Versão alternativa da Aurora: elipses translúcidas em movimento">
<link rel="icon" href="alt-favicon.ico" sizes="any">
<link rel="icon" href="alt-favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="alt-apple-touch-icon.png">
<link rel="manifest" href="alt-version.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Aurora Alt">
<meta property="og:description" content="Versão alternativa da Aurora: elipses translúcidas em movimento">
<meta property="og:url" content="https://romastefale.github.io/aurora/alt-version.html">
<meta property="og:image" content="https://romastefale.github.io/aurora/alt-og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --base: #f4f3f1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --base: #141416; }
  }
  html {
    background: var(--base);
    touch-action: none;
  }
  body {
    margin: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100lvh;
  }
</style>
</head>
<body>
<canvas></canvas>
<script>
(() => {
  const vertex = `
    attribute vec2 p;
    void main() {
      gl_Position = vec4(p, 0.0, 1.0);
    }
  `;

  const fragment = `
    precision highp float;
    uniform vec2 u_res;
    uniform vec4 u_ellipse[7];
    uniform vec4 u_ink[7];
    uniform float u_sigma;
    uniform vec3 u_base;
    uniform vec3 u_edge;

    float erf(float x) {
      float s = sign(x);
      x = abs(x);
      float t = 1.0 + x * (0.278393 + x * (0.230389 + x * (0.000972 + x * 0.078108)));
      t *= t;
      return s * (1.0 - 1.0 / (t * t));
    }

    vec3 toSrgb(vec3 c) {
      return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));
    }

    float bayer2(vec2 a) {
      a = floor(a);
      return fract(a.x / 2.0 + a.y * a.y * 0.75);
    }

    float bayer4(vec2 a) {
      return bayer2(0.5 * a) * 0.25 + bayer2(a);
    }

    void main() {
      vec2 p = vec2(gl_FragCoord.x, u_res.y - gl_FragCoord.y) / max(u_res.x, u_res.y);
      vec4 acc = vec4(0.0);
      for (int k = 0; k < 7; k++) {
        vec4 e = u_ellipse[k];
        float d = (length((p - e.xy) / e.zw) - 1.0) * sqrt(e.z * e.w);
        float a = u_ink[k].a * 0.5 * (1.0 - erf(d / (u_sigma * 1.41421356)));
        acc = vec4(u_ink[k].rgb * a, a) + acc * (1.0 - a);
      }
      vec3 lin = acc.a > 0.00001 ? acc.rgb / acc.a : vec3(0.0);
      vec3 color = toSrgb(clamp(lin, 0.0, 1.0)) * acc.a + u_base * (1.0 - acc.a);
      float y = gl_FragCoord.y / u_res.y;
      color = mix(u_edge, color, smoothstep(0.0, 0.14, min(y, 1.0 - y)));
      color += (bayer4(gl_FragCoord.xy) - 0.5) / 255.0;
      gl_FragColor = vec4(color, 1.0);
    }
  `;

  const canvas = document.querySelector('canvas');
  const gl = canvas.getContext('webgl');
  if (!gl) return;
  const scheme = matchMedia('(prefers-color-scheme: dark)');
  const COUNT = 7;
  const SIGMA = 0.049;
  const random = (min, max) => min + Math.random() * (max - min);
  const blooms = Array.from({ length: COUNT }, () => ({
    hue: random(0, 360),
    spin: random(3, 8) * (Math.random() < 0.5 ? -1 : 1),
    ways: Array.from({ length: 4 }, () => [random(0.08, 0.2), random(0, Math.PI * 2)]),
    rx: random(0.22, 0.49),
    ry: random(0.17, 0.39)
  }));

  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [f(0), f(8), f(4)];
  }

  const toLinear = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const toSrgb = c => (c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);

  function erf(x) {
    const s = Math.sign(x);
    x = Math.abs(x);
    let t = 1 + x * (0.278393 + x * (0.230389 + x * (0.000972 + x * 0.078108)));
    t *= t;
    return s * (1 - 1 / (t * t));
  }

  function scene(t) {
    const m = Math.max(canvas.width, canvas.height);
    const wide = canvas.width / m;
    const tall = canvas.height / m;
    const dark = scheme.matches;
    const alpha = dark ? 0.75 : 0.85;
    const ellipse = [];
    const ink = [];
    for (const b of blooms) {
      const wave = i => Math.sin(t * b.ways[i][0] + b.ways[i][1]);
      const breathe = 1 + 0.15 * wave(2);
      ellipse.push(
        wide * (0.5 + 0.55 * wave(0)),
        tall * (0.5 + 0.55 * wave(1)),
        b.rx * breathe,
        b.ry * (2 - breathe) * (1 + 0.1 * wave(3))
      );
      const rgb = hsl(b.hue + b.spin * t, dark ? 0.58 : 0.72, dark ? 0.42 : 0.58).map(toLinear);
      ink.push(...rgb, alpha);
    }
    return { ellipse, ink, wide, tall };
  }

  function colorAt(x, y, { ellipse, ink }) {
    let acc = [0, 0, 0, 0];
    for (let k = 0; k < COUNT; k++) {
      const [cx, cy, rx, ry] = ellipse.slice(k * 4, k * 4 + 4);
      const d = (Math.hypot((x - cx) / rx, (y - cy) / ry) - 1) * Math.sqrt(rx * ry);
      const a = ink[k * 4 + 3] * 0.5 * (1 - erf(d / (SIGMA * Math.SQRT2)));
      acc = [0, 1, 2].map(c => ink[k * 4 + c] * a + acc[c] * (1 - a)).concat(a + acc[3] * (1 - a));
    }
    return baseColor.map((b, c) => {
      const lin = acc[3] > 0.00001 ? Math.min(1, acc[c] / acc[3]) : 0;
      return toSrgb(lin) * acc[3] + b * (1 - acc[3]);
    });
  }

  function edge(view) {
    const sum = [0, 0, 0];
    for (const y of [0, view.tall]) {
      for (let i = 0; i < 12; i++) {
        const c = colorAt(((i + 0.5) / 12) * view.wide, y, view);
        for (let j = 0; j < 3; j++) sum[j] += c[j];
      }
    }
    return sum.map(v => v / 24);
  }

  function shader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    return s;
  }

  const root = document.documentElement;
  let uRes, uEllipse, uInk, uBase, uEdge;
  let baseColor = [0, 0, 0];

  function setup() {
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, vertex));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragment));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return false;
    gl.useProgram(program);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, 'p');
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    uRes = gl.getUniformLocation(program, 'u_res');
    uEllipse = gl.getUniformLocation(program, 'u_ellipse');
    uInk = gl.getUniformLocation(program, 'u_ink');
    uBase = gl.getUniformLocation(program, 'u_base');
    uEdge = gl.getUniformLocation(program, 'u_edge');
    gl.uniform1f(gl.getUniformLocation(program, 'u_sigma'), SIGMA);

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    base();
    return true;
  }

  function base() {
    const hex = getComputedStyle(root).getPropertyValue('--base').trim();
    baseColor = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
    gl.uniform3f(uBase, ...baseColor);
  }

  let ready = false;

  function frame(now) {
    if (!ready) return;
    const view = scene(now / 1000);
    const border = edge(view);
    gl.uniform4fv(uEllipse, view.ellipse);
    gl.uniform4fv(uInk, view.ink);
    gl.uniform3f(uEdge, ...border);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    root.style.backgroundColor = `rgb(${border.map(v => Math.round(v * 255)).join(', ')})`;
    requestAnimationFrame(frame);
  }

  new ResizeObserver(([{ contentRect }]) => {
    canvas.width = Math.max(1, Math.round(contentRect.width));
    canvas.height = Math.max(1, Math.round(contentRect.height));
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }).observe(canvas);

  scheme.addEventListener('change', base);

  canvas.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    ready = false;
  });
  canvas.addEventListener('webglcontextrestored', () => {
    ready = setup();
    if (ready) requestAnimationFrame(frame);
  });

  canvas.addEventListener('pointerup', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    const request = root.requestFullscreen || root.webkitRequestFullscreen;
    if (request) Promise.resolve(request.call(root)).catch(() => {});
  });

  ready = setup();
  if (ready) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
